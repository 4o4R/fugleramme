name: Review Nelson's Sparrow historical plate cut
on:
  push:
    branches: [texas-artwork-coverage]
    paths:
      - .github/workflows/texas-nelson-review.yml
      - .texas-curation/nelson_candidate.py
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: texas-artwork-coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: texas-historical-sources-1
          run-id: 35135019447
          github-token: ${{ github.token }}
          path: inputs/historical
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - name: Install pinned CPU segmentation environment
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Build reviewed specimen candidates
        run: |
          python .texas-curation/nelson_candidate.py \
            inputs/historical/sources-2/43454842.png inputs/mask-tools /tmp/nelson
      - uses: actions/upload-artifact@v4
        with:
          name: texas-nelson-candidates-${{ github.run_number }}
          path: /tmp/nelson/
          if-no-files-found: error
          retention-days: 30
