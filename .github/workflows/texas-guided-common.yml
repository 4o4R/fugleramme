# .github/workflows/texas-guided-common.yml
# Fork-only candidate generation. This workflow cannot publish to main.
name: Review guided common Texas specimens
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-guided-common.yml]
permissions:
  contents: read
  actions: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/evidence
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: texas-source-images-*-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/sources
      - name: Install pinned non-generative selection tools
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Cut only the explicitly selected specimens
        run: |
          python .texas-curation/guided_specimens.py \
            --spec .texas-curation/guided-common-1.json \
            --evidence inputs/evidence --sources inputs/sources \
            --mask-tools inputs/mask-tools --output /tmp/guided-common
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-guided-common-${{ github.run_number }}
          path: /tmp/guided-common/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 2
