# .github/workflows/texas-historical-sources.yml
# Fork-only research. The source metadata is preserved, never treated as approval.
name: Resolve historical source names
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-historical-sources.yml]
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: .texas-curation/harvest/
      - run: python -m pip install pillow requests
      - run: python .texas-curation/historical_names.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-historical-sources-${{ github.run_number }}
          path: .texas-curation/historical-sources/
          include-hidden-files: true
          compression-level: 3
          retention-days: 30
