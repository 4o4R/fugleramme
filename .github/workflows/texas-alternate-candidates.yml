name: Build alternate-source Texas artwork candidates
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-alternate-candidates.yml]
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/evidence
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - name: Install pinned CPU selection environment
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Build three masks from each cleaner alternate source
        run: |
          python .texas-curation/alternate_candidates.py \
            --repo . --evidence inputs/evidence --mask-tools inputs/mask-tools \
            --output /tmp/alternate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-alternate-candidates-${{ github.run_number }}
          path: /tmp/alternate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 3
