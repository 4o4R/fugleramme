name: Publish four recovered source-gap illustrations
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-source-gap4-main.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: texas-artwork-coverage
          path: curation
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: project
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: texas-missing-category-sources-2
          run-id: 35165316556
          github-token: ${{ github.token }}
          path: sources
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: mask-tools
      - name: Install pinned CPU segmentation environment
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Install project environment
        working-directory: project
        run: uv sync --locked
      - name: Build and add four visually reviewed cuts
        run: |
          project/.venv/bin/python curation/.texas-curation/publish_source_gap4.py \
            --repo project --sources sources --mask-tools mask-tools --output final-output
      - name: Validate fork main candidate
        working-directory: project
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run mypy
          uv run pytest -q --junitxml=../final-output/pytest.xml
          shellcheck install.sh run.sh
      - name: Commit directly to fork main
        working-directory: project
        run: |
          git config user.name '4o4R'
          git config user.email '120294988+4o4R@users.noreply.github.com'
          git add assets/artwork/classic/ATTRIBUTION.md assets/artwork/classic/manifest.json assets/artwork/classic/birds
          if git diff --cached --quiet; then exit 0; fi
          COUNT=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('../final-output/summary.json').read_text())['shipped'])
          PY
          )
          git commit -m "chore(assets): add ${COUNT} recovered regional bird illustrations"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-gap4-main-${{ github.run_number }}
          path: final-output/
          if-no-files-found: warn
          retention-days: 30
