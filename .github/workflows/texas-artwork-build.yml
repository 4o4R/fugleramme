# .github/workflows/texas-artwork-build.yml
# Fork-only source acquisition; never auto-promote downloads to shipping assets.
name: Acquire public-domain Texas artwork
on:
  push:
    branches: [texas-artwork-coverage]
    paths:
      - .github/workflows/texas-artwork-build.yml
      - .texas-curation/commons_sources.py
permissions:
  contents: write
concurrency:
  group: texas-curation
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source acquisition dependencies
        run: python -m pip install 'Pillow==11.3.0' 'requests==2.32.5'
      - uses: actions/cache@v4
        with:
          path: .texas-curation/cache
          key: texas-pd-v3-${{ github.run_id }}
          restore-keys: texas-pd-v3-
      - name: Fetch independently licensed sources
        run: python .texas-curation/commons_sources.py
      - name: Commit source audit only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .texas-curation/pd-sources/*.csv .texas-curation/pd-sources/*.json .texas-curation/pd-sources/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(assets): record public-domain source evidence'
            git push origin HEAD:texas-artwork-coverage
          fi
      - name: Upload source scans for visual curation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-pd-sources-${{ github.run_number }}
          path: .texas-curation/pd-sources/
          include-hidden-files: true
          retention-days: 30
          compression-level: 3
