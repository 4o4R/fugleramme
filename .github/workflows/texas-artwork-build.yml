# .github/workflows/texas-artwork-build.yml
# Fork-only curation workflow. Sources are not automatically approved as artwork.
name: Audit Texas artwork sources

on:
  push:
    branches: [texas-artwork-coverage]
    paths:
      - .github/workflows/texas-artwork-build.yml
      - .texas-curation/collect.py

permissions:
  contents: write

concurrency:
  group: texas-curation
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out contribution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install acquisition dependencies
        run: python -m pip install 'Pillow==11.3.0' 'requests==2.32.5'
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: .texas-curation/cache
          key: texas-sources-v2-${{ github.run_id }}
          restore-keys: texas-sources-v2-
      - name: Inventory sources and quarantine unreviewed cutouts
        run: python .texas-curation/collect.py
      - name: Commit review data, not unapproved images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/artwork/classic/manifest.json assets/artwork/classic/birds
          git add .texas-curation/quarantine .texas-curation/initial-review.csv
          git add .texas-curation/output/*.csv .texas-curation/output/*.json .texas-curation/output/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(assets): inventory Audubon sources and quarantine unreviewed Texas cutouts'
            git push origin HEAD:texas-artwork-coverage
          fi
      - name: Upload source images and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-source-inventory-${{ github.run_number }}
          path: |
            .texas-curation/output/
            .texas-curation/initial-review.csv
            .texas-curation/quarantine/
          include-hidden-files: true
          retention-days: 30
          compression-level: 3
