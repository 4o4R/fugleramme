# .github/workflows/texas-guided-alpha.yml
# Read-only candidate generation with lossless editable alpha evidence.
name: Preserve guided specimen alpha evidence
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-guided-alpha.yml]
permissions:
  contents: read
  actions: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/evidence
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: texas-source-images-*-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/sources
      - name: Install pinned selection tools
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Build exact specimen mask evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.texas-curation')
          specs=json.loads((root/'guided-common-1.json').read_text())+json.loads((root/'guided-regional-1.json').read_text())
          for i,s in enumerate(specs):
              if s['rank']==68:
                  specs[i]={'rank':68,'box':[50,51,64,63],'positive':[[55,57],[58,60],[52,54]],'negative':[[50,60],[64,58],[57,66]]}
          Path('/tmp/guided-specs.json').write_text(json.dumps(specs))
          PY
          python .texas-curation/export_guided_masks.py \
            --spec /tmp/guided-specs.json --evidence inputs/evidence \
            --sources inputs/sources --mask-tools inputs/mask-tools \
            --output /tmp/guided-alpha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-guided-alpha-${{ github.run_number }}
          path: /tmp/guided-alpha/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 2
