# .github/workflows/texas-final-contribution.yml
# Fork-only assembly and QA. No curation scripts or workflows enter the clean branch.
name: Validate reviewed Texas contribution
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-final-contribution.yml]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      CLEAN_BRANCH: texas-reviewed-artwork-20260916
    steps:
      - uses: actions/checkout@v4
        with:
          path: curation
      - uses: actions/checkout@v4
        with:
          repository: arnegiacomo/fugleramme
          ref: 1423668dcab119e372c45ea93dc54154d1352a78
          path: project
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: texas-reviewed-candidates-1
          run-id: 35126173094
          github-token: ${{ github.token }}
          path: inputs/review
      - uses: actions/download-artifact@v4
        with:
          name: texas-pd-sources-3
          run-id: 35124235820
          github-token: ${{ github.token }}
          path: inputs/pd
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/harvest
      - uses: actions/download-artifact@v4
        with:
          name: texas-historical-sources-1
          run-id: 35135019447
          github-token: ${{ github.token }}
          path: inputs/historical
      - name: Install isolated, pinned curation dependencies
        run: |
          python -m venv buildenv
          buildenv/bin/python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          buildenv/bin/python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors
      - name: Build only the reviewed artwork increment
        run: |
          buildenv/bin/python curation/.texas-curation/finalize_contribution.py \
            --repo project --inputs curation --review inputs/review --pd inputs/pd \
            --mask-tools inputs/mask-tools --harvest inputs/harvest \
            --historical inputs/historical --output final-output
      - name: Install the unchanged application lockfile
        working-directory: project
        run: uv sync --locked
      - name: Check formatting across the actual clean tree
        working-directory: project
        run: uv run ruff format --check
      - name: Lint across the actual clean tree
        working-directory: project
        run: uv run ruff check
      - name: Check application types
        working-directory: project
        run: uv run mypy
      - name: Run the full suite with final assets present
        working-directory: project
        run: uv run pytest -q --junitxml=../final-output/pytest.xml
      - name: Check installation shell scripts
        working-directory: project
        run: shellcheck install.sh run.sh
      - name: Record passed checks and an auditable clean diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess, xml.etree.ElementTree as ET
          out = Path('final-output')
          summary = json.loads((out / 'summary.json').read_text())
          suites = ET.parse(out / 'pytest.xml').getroot().findall('testsuite')
          metrics = {k: sum(int(s.attrib.get(k, 0)) for s in suites) for k in ['tests', 'failures', 'errors', 'skipped']}
          assert metrics['tests'] > 0 and metrics['failures'] == metrics['errors'] == 0
          summary['pytest'] = metrics
          summary['passed_checks'] = ['uv sync --locked', 'ruff format --check', 'ruff check', 'mypy', 'full pytest suite with final assets', 'shellcheck install.sh run.sh']
          summary['clean_branch'] = 'texas-reviewed-artwork-20260916'
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          repro = out / 'reproducibility'
          repro.mkdir()
          for name in ['final-mask-spec.json', 'finalize_contribution.py']:
              shutil.copy2(Path('curation/.texas-curation') / name, repro / name)
          (out / 'application-diff.txt').write_text(subprocess.check_output(['git', '-C', 'project', 'diff', '--stat'], text=True))
          PY
      - name: Publish a new clean branch without overwriting another ref
        working-directory: project
        run: |
          git remote set-url origin https://github.com/4o4R/fugleramme.git
          if [ -n "$(git ls-remote --heads origin "refs/heads/$CLEAN_BRANCH")" ]; then
            echo 'Ref already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git checkout -b "$CLEAN_BRANCH"
          git add assets/artwork/classic
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          ledger = json.loads(Path('../final-output/asset-provenance.json').read_text())
          allowed = {'assets/artwork/classic/manifest.json', 'assets/artwork/classic/ATTRIBUTION.md'}
          allowed.update('assets/artwork/classic/birds/' + r['asset'] for r in ledger)
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert actual == allowed, {'unexpected': sorted(actual - allowed), 'missing': sorted(allowed - actual)}
          assert not subprocess.check_output(['git', 'diff', '--name-only'], text=True).strip()
          PY
          git config user.name '4o4R'
          git config user.email '120294988+4o4R@users.noreply.github.com'
          git commit -m 'chore(assets): add 18 reviewed North American bird illustrations'
          git push origin "HEAD:refs/heads/$CLEAN_BRANCH"
          git rev-parse HEAD > ../final-output/COMMIT.txt
          git diff HEAD^ HEAD --stat > ../final-output/application-diff.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-reviewed-contribution-${{ github.run_number }}
          path: final-output/
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 6
          retention-days: 30
