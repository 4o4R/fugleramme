name: Refine rejected Texas artwork candidates
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-mass-refine2.yml]
permissions:
  actions: read
  contents: read
jobs:
  refine:
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {path: curation}
      - uses: actions/checkout@v4
        with:
          ref: texas-reviewed-artwork-20260916
          path: covered
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-evidence-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/evidence
      - uses: actions/download-artifact@v4
        with:
          name: texas-offline-mask-tools
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/mask-tools
      - uses: actions/download-artifact@v4
        with:
          name: texas-source-images-${{ matrix.part }}-1
          run-id: 35131216249
          github-token: ${{ github.token }}
          path: inputs/source
      - name: Install pinned CPU selection environment
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 pillow==12.3.0 opencv-python-headless==4.13.0.92 timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.8.0
      - name: Refine rejected candidates
        run: |
          python curation/.texas-curation/mass_refine2.py \
            --evidence inputs/evidence --sources inputs/source --mask-tools inputs/mask-tools \
            --covered covered --approved curation/.texas-curation/mass-approved.json \
            --coordination curation/.texas-curation/coordination-exclusions.json \
            --reviewed curation/.texas-curation/reviewed-exclusions.json \
            --part ${{ matrix.part }} --output /tmp/refine-${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-refine2-${{ matrix.part }}-${{ github.run_number }}
          path: /tmp/refine-${{ matrix.part }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 2
