# .github/workflows/texas-guided-alternatives-b.yml
# Exact-source research only; unidentified terms are retained as review items.
name: Retrieve guided bird source alternatives
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-guided-alternatives-b.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install pillow requests
      - name: Preserve each source and metadata independently
        run: |
          python - <<'PY'
          from pathlib import Path
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('harvest',Path('.texas-curation/harvest_sources.py'))
          h=importlib.util.module_from_spec(spec);spec.loader.exec_module(h)
          h.OUT=Path('/tmp/guided-alternatives');h.OUT.mkdir(parents=True)
          targets=[
            (4,'File:Mourner the Dove.jpg'),
            (20,'File:Chicoree the Goldfinch.jpg'),
            (22,'File:The first book of birds; (1899) (14568904320).jpg'),
            (22,'File:Birds of village and field- a bird book for beginners (1898) (14752994214).jpg'),
            (22,'File:A year with the birds (1917) (14563510077).jpg'),
            (22,'File:FMIB 43296 Cedar Waxwing (upper).jpeg'),
            (108,'File:Bird-life (Plate II) (5978287912).jpg'),
            (108,'File:Birds of New York (Plate 1) (6961837311).jpg'),
            (108,'File:FMIB 41931 Pied-Billed Grebe and nest with Young Birds.jpeg')
          ]
          f=h.helpers.Fetcher();rows=[];metadata=[];errors=[]
          for rank,title in targets:
              try:
                  for p in h.query(f,titles=title):
                      metadata.append(p)
                      license=h.field(p,'LicenseShortName')
                      if license not in ('Public domain','CC0'):
                          errors.append({'rank':rank,'title':title,'license':license,'status':'terms need independent review'})
                          continue
                      meta=h.download(f,p)
                      rows.append({'rank':rank,'source':meta})
                      print(rank,title,meta['pageid'],meta['license'],flush=True)
              except Exception as error:
                  errors.append({'rank':rank,'title':title,'error':repr(error)})
              (h.OUT/'choices.json').write_text(json.dumps(rows,indent=2))
              (h.OUT/'metadata.json').write_text(json.dumps(metadata,indent=2))
              (h.OUT/'review-items.json').write_text(json.dumps(errors,indent=2))
          if not rows:raise RuntimeError('No sources retrieved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-guided-alternatives-b-${{ github.run_number }}
          path: /tmp/guided-alternatives/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
