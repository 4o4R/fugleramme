# .github/workflows/texas-source-finish.yml
# Fork-only curation. These jobs never approve artwork or modify the application.
name: Finish Texas source acquisition
on:
  push:
    branches: [texas-artwork-coverage]
    paths: [.github/workflows/texas-source-finish.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Research all unresolved worklist sources
        run: python .texas-curation/harvest_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-evidence-${{ github.run_number }}
          path: |
            .texas-curation/harvest/*.json
            .texas-curation/harvest/*.csv
          include-hidden-files: true
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-images-0-${{ github.run_number }}
          path: .texas-curation/harvest/sources-0/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-images-1-${{ github.run_number }}
          path: .texas-curation/harvest/sources-1/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-images-2-${{ github.run_number }}
          path: .texas-curation/harvest/sources-2/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texas-source-images-3-${{ github.run_number }}
          path: .texas-curation/harvest/sources-3/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
  mask-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ChaoningZhang/MobileSAM
          ref: f706ad9c4eb7f219c00d9050e46328518ffb65d2
          path: mobile-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export non-generative selection tools for offline review
        run: |
          mkdir -p /tmp/mask-tools/wheels
          cp -a mobile-source/mobile_sam /tmp/mask-tools/
          cp mobile-source/weights/mobile_sam.pt /tmp/mask-tools/
          cp mobile-source/LICENSE /tmp/mask-tools/MobileSAM-LICENSE
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/mask-tools/wheels timm==0.9.2 huggingface_hub==0.24.7 safetensors==0.4.5
          sha256sum /tmp/mask-tools/mobile_sam.pt > /tmp/mask-tools/WEIGHT_SHA256.txt
          echo f706ad9c4eb7f219c00d9050e46328518ffb65d2 > /tmp/mask-tools/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: texas-offline-mask-tools
          path: /tmp/mask-tools/
          if-no-files-found: error
          retention-days: 7
